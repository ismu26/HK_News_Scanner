name: Daily collection (no AI)

on:
  schedule:
    # 22:45 UTC Sun-Thu = 06:45 HKT Mon-Fri. GitHub can start scheduled runs
    # late at busy times, so this leaves a 45-minute buffer before vetting.
    - cron: "45 22 * * 0-4"
  workflow_dispatch:
    inputs:
      setup:
        description: "Run the one-off 30-day set-up scan"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - name: Collect
        run: |
          if [ "${{ inputs.setup }}" = "true" ]; then
            python run.py collect --setup
          else
            python run.py collect
          fi
      - name: Commit results
        run: |
          git config user.name "news-scanner-bot"
          git config user.email "news-scanner-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Collection run $(TZ=Asia/Hong_Kong date +%F)"
          git push
